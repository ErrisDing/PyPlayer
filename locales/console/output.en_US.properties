# PyPlayer - Console output text (English)
# Console output text for US English locale

## Test header (for main() function tests)
console.test_title=== PyPlayer Player Test ===

## Supported formats messages
console.supported_formats_audio=Supported audio formats: {formats}
console.supported_formats_video=Supported video formats: {formats}

## Initialization warnings and errors
console.init_warning_audio=Audio module initialization warning: {error}
console.init_warning_video=Video module initialization warning: {error}
console.play_failed=Playback failed: {error}
console.queue_failed=Playlist queue failed: {error}
console.video_play_failed=Video playback failed: {error}

## User action messages
console.user_exit=User exited video playback
console.unsupported_format=Unsupported file format: {path}
console.start_video_play=Starting video playback: {path}
console.play_complete_or_stopped=Playback complete or stopped
