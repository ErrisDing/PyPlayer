## Library sidebar (batch 2 Task 4)
## The panel lists names only: scanning never reads metadata, so a per-library
## track count does not exist before batch 4. No count copy here on purpose.
## The footer carries both administration entries (add + manage): spec §3.2's
## Task 8 correction moved 管理媒体库 here because §6 freezes the rail at seven
## actions and management is not one of them.
sidebar.title=Media Libraries
sidebar.empty=No media libraries yet. Use Add Library below to choose a music folder.
sidebar.add=Add Library
sidebar.manage=Manage Libraries

## Playlist context menu (batch 3 Task 2)
## The prefix is ctx., not menu. (ruling R5): menu.* is the QMenuBar copy block
## batch 2 retired -- 13 keys, only menu.exit of them still has a consumer in the
## whole repo. New right-click copy inside that prefix would turn the dead-key
## census from a block delete into a per-key audit; ctx. also matches the per-widget
## prefixes already in use (rail.* / sidebar.*).
## ctx.remove_count uses the single-brace {count} form: _substitute accepts both,
## but every properties file in this repo uses the single form.
ctx.play=Play
ctx.pause=Pause
ctx.remove=Remove from Playlist
ctx.remove_count=Remove {count} items
ctx.clear_playlist=Clear Playlist

## Playlist metadata columns and their two state marks (batch 4, Task 8)
## The marks are single characters: the playlist's data cells are ~120px wide,
## and a word ("waiting"/"none") would be the widest thing in the row.
## ``col.duration`` is "Time", not "Duration": the duration column is
## COLUMN_DURATION_WIDTH (56px) wide because a MM:SS measures 48px, and
## "Duration" wants 104px of the same font -- a heading wider than its own
## column would be elided over the numbers it labels. The test that measures
## this is ``tests/test_playlist_columns.py::PlaylistHeaderTest``.
col.name=Name
col.duration=Time
col.artist=Artist
col.album=Album
meta.pending=⋯
meta.unknown=—
