<!-- info: about glyph. An 8-unit-radius ring with a 6-unit-radius hole
     (fill-rule even-odd, so the 2-unit wall is one path and the hole stays
     transparent like every other outlined glyph in the set), plus a 2x2 square
     dot and a 2x7 stem. Square terminals, because the set's weight is 2 units
     everywhere else and a round tipped dot is 1.6 px of ink at 20 px.
     Ink spans x 4..20 and y 4..20 (16 units square), the same box as settings,
     so the two glyphs at the foot of the rail stand at one size. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <path fill="currentColor" fill-rule="evenodd" d="M4 12a8 8 0 1 0 16 0a8 8 0 1 0 -16 0zM6 12a6 6 0 1 0 12 0a6 6 0 1 0 -12 0z"/>
  <path fill="currentColor" d="M11 6.5h2v2h-2zM11 10h2v7h-2z"/>
</svg>
